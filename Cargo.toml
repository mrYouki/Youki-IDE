[workspace]
resolver = "2"
members = [
    "crates/youki-cli",
    "crates/youki-build-engine",
    "crates/youki-sdk-manager",
    "crates/youki-toolchain",
    "crates/youki-manifest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Youki Build contributors"]

# Keep dependency versions in one place so every crate in the
# workspace stays in lockstep instead of drifting per-crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
which = "6"
zip = "0.6"
walkdir = "2"
indicatif = "0.17"
console = "0.15"
ureq = "2"
sha2 = "0.10"

[profile.release]
# Small, fast binary — this ships to end-user machines/Termux, not a
# dev workstation. LTO + strip trade compile time for a much smaller
# `youki` binary, which matters on constrained Android/Termux storage.
lto = true
strip = true
codegen-units = 1
