name: Build All Platforms Release

on:
  push:
    tags:
      - 'v*' # يشتغل التلقائي أول ما تسوين Tag مثل v1.0.0

jobs:
  build-cross:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Termux / Android (ARM64 - 64-bit)
          - target: aarch64-linux-android
            name: youki-termux-arm64
            use_cross: true

          # Android (ARM v7 - 32-bit)
          - target: armv7-linux-androideabi
            name: youki-android-armv7
            use_cross: true

          # Android (x86_64 - 64-bit Emulators/Intel)
          - target: x86_64-linux-android
            name: youki-android-x86_64
            use_cross: true

          # Android (x86 - 32-bit Emulators/Intel)
          - target: i686-linux-android
            name: youki-android-x86
            use_cross: true

          # Linux Desktop (x86_64 - 64-bit)
          - target: x86_64-unknown-linux-musl
            name: youki-linux-x86_64
            use_cross: false

          # Linux ARM64 (64-bit - Raspberry Pi 3/4/5)
          - target: aarch64-unknown-linux-musl
            name: youki-linux-arm64
            use_cross: true

          # Linux ARM32 (32-bit - Raspberry Pi 1/2/Zero/Legacy) 🗿
          - target: armv7-unknown-linux-musleabihf
            name: youki-linux-armv7
            use_cross: true

          # Windows (x86_64 - 64-bit)
          - target: x86_64-pc-windows-gnu
            name: youki-windows-x64.exe
            use_cross: true

          # Windows (i686 - 32-bit)
          - target: i686-pc-windows-gnu
            name: youki-windows-x86.exe
            use_cross: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-rs Tool
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary (Standard or Cross)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Binary Output
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "$BIN_DIR/youki.exe" "./${{ matrix.name }}"
          else
            cp "$BIN_DIR/youki" "./${{ matrix.name }}"
          fi

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
