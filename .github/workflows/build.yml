name: Build All Platforms Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cross:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            name: youki-termux-arm64
          - target: armv7-linux-androideabi
            name: youki-android-armv7
          - target: x86_64-linux-android
            name: youki-android-x86_64
          - target: i686-linux-android
            name: youki-android-x86
          - target: x86_64-unknown-linux-musl
            name: youki-linux-x86_64
          - target: aarch64-unknown-linux-musl
            name: youki-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            name: youki-linux-armv7
          - target: x86_64-pc-windows-gnu
            name: youki-windows-x64.exe
          - target: i686-pc-windows-gnu
            name: youki-windows-x86.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        run: sudo systemctl start docker

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Tool
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build Binary with Cross
        run: |
          if [[ "${{ matrix.target }}" == *"android"* ]]; then
            CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS="-C link-arg=-lc" cross build --release --target ${{ matrix.target }}
          else
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Binary Output
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "$BIN_DIR/youki.exe" "./${{ matrix.name }}"
          else
            cp "$BIN_DIR/youki" "./${{ matrix.name }}"
          fi

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
